:root {

  --g4: #a8c8f0;

  --text2: #636e72;
  --text3: #b2bec3;
  --radius: 20px;

}

html, body {
  height: 100%;
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background: linear-gradient(160deg, var(--g1) 0%, var(--g2) 35%, var(--g3) 70%, var(--g4) 100%);

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}

/* ===== App Container ===== */
.app {
  width: 100%;
  max-width: 460px;
  position: relative;
}

/* ===== Language Toggle ===== */
.lang-toggle {
  position: fixed;
  top: 16px;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  right: max(16px, env(safe-area-inset-right));
  z-index: 100;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
  transition: all .2s;
  border: none;
}
.lang-toggle:active { transform: scale(.95); opacity: .8; }

/* ===== Screen ===== */
.screen { display: none; }
.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeIn .4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Start Screen ===== */
.start-screen { text-align: center; padding-top: 40px; }

.start-icon {
  font-size: 72px;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.start-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 8px;
  letter-spacing: -.3px;
}
.start-subtitle {
  font-size: 16px;
  color: var(--text2);
  font-weight: 400;
  margin-bottom: 8px;
  line-height: 1.5;
}
.start-meta {
  font-size: 13px;
  color: var(--text3);
  margin-bottom: 36px;
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.start-meta span {
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 20px;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 16px;
  font-family: var(--font);
  font-weight: 700;
  font-size: 17px;
  cursor: pointer;
  transition: all .2s;
  min-height: 52px;
  padding: 14px 32px;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.96); }
.btn-primary {
  background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%);
  color: #fff;
  box-shadow: 0 6px 24px rgba(255,107,107,.35);
  width: 100%;
  font-size: 18px;
}
.btn-secondary {
  background: var(--card);
  color: var(--text);
  box-shadow: var(--card-shadow);
  width: 100%;
}

/* ===== Progress Bar ===== */
.progress-wrap {
  width: 100%;
  margin-bottom: 28px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text2);
  font-weight: 500;
}
.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,.5);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff9a56, #ff6b6b);
  border-radius: 3px;
  transition: width .35s ease;
}

/* ===== Question Card ===== */
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--card-shadow);
  width: 100%;
  margin-bottom: 20px;
}
.question-number {
  font-size: 13px;
  color: #ff6b6b;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.question-text {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.4;
  color: var(--text);
  margin-bottom: 24px;
}

/* ===== Option Cards ===== */
.options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.option-card {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  background: #f8f9fa;
  border: 2px solid transparent;
  border-radius: 16px;
  padding: 16px 18px;
  font-family: var(--font);
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  transition: all .2s;
  text-align: left;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.option-card:active { transform: scale(.98); background: #eef0f2; }
.option-letter {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9a56, #ff6b6b);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 15px;
}

/* ===== Result Screen ===== */
.result-screen { padding-top: 8px; }

.result-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  width: 100%;
  overflow: hidden;
  margin-bottom: 20px;
}

.result-header {

.result-emoji {

  margin-bottom: 12px;
  line-height: 1;
}
.result-name-zh {

.result-name-en {

  border-radius: 24px;
  font-size: 16px;
  font-weight: 700;

.result-body { padding: 24px; }

.result-section { margin-bottom: 20px; }
.result-section:last-child { margin-bottom: 0; }
.result-label {

  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;

.result-traits {

  padding: 16px 20px;
  background: #fdf6f0;
  border-radius: 14px;
  border-left: 3px solid #ff9a56;
  position: relative;

.result-quote::before {

  color: #ff9a56;
  font-style: normal;
  font-weight: 900;
  line-height: 1;

.result-book {

.result-actions {

  flex-direction: column;

.poster-overlay {

  max-height: 70vh;
  border-radius: 16px;
  box-shadow: 0 16px 60px rgba(0,0,0,.3);

.poster-hint {

  font-weight: 500;
  text-align: center;

.poster-close {
  background: rgba(255,255,255,.2);

  border-radius: 24px;
  padding: 10px 28px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);

/* ===== Responsive ===== */
@media (max-width: 380px) {
  .start-title { font-size: 24px; }
  .question-text { font-size: 20px; }
  .result-name-zh { font-size: 28px; }
  .option-card { font-size: 15px; padding: 14px 16px; }
}
</style>

// ============================================================
// STATE
// ============================================================

let lang = 'ZH';            // 'ZH' | 'EN'
let currentQ = 0;           // 0-9
let scores = {};            // { characterId: totalScore }
let resultChar = null;

// ============================================================
// HELPERS
// ============================================================

function t(zh, en) { return lang === 'ZH' ? zh : en; }

function $id(id) { return document.getElementById(id); }

function resetScores() {
  scores = {};
  characters.forEach(c => { scores[c.id] = 0; });
}

// ============================================================
// SCREEN SWITCHING
// ============================================================

function showScreen(name) {
  ['startScreen', 'quizScreen', 'resultScreen'].forEach(id => {
    $id(id).classList.remove('active');
  });
  const map = { start: 'startScreen', quiz: 'quizScreen', result: 'resultScreen' };
  $id(map[name]).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// START SCREEN
// ============================================================

function initStartScreen() {
  $id('startBtn').addEventListener('click', startQuiz);
}

function startQuiz() {
  resetScores();
  currentQ = 0;
  resultChar = null;
  renderQuestion();
  showScreen('quiz');
}

// ============================================================
// QUIZ SCREEN
// ============================================================

function renderQuestion() {
  const q = questions[currentQ];
  $id('questionNumber').textContent =
    t('QUESTION', 'QUESTION') + ' ' + (currentQ + 1);
  $id('questionText').textContent = t(q.textZH, q.textEN);
  $id('progressLabel').textContent =
    t(`第 ${currentQ + 1} 题 / 共 10 题`, `Question ${currentQ + 1} of 10`);
  $id('progressPct').textContent = Math.round((currentQ / 10) * 100) + '%';
  $id('progressFill').style.width = ((currentQ / 10) * 100) + '%';

  const container = $id('optionsContainer');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-card';
    btn.innerHTML = `
      <span class="option-letter">${opt.letter}</span>
      <span>${t(opt.textZH, opt.textEN)}</span>
    `;
    btn.addEventListener('click', () => selectOption(idx));
    container.appendChild(btn);
  });
}

function selectOption(optIdx) {
  const q = questions[currentQ];
  const chosen = q.options[optIdx];

  // Add scores
  Object.entries(chosen.scores).forEach(([charId, pts]) => {
    scores[charId] = (scores[charId] || 0) + pts;
  });

  currentQ++;

  if (currentQ >= questions.length) {
    showResult();
  } else {
    renderQuestion();
    $id('progressFill').style.width = ((currentQ / 10) * 100) + '%';
    $id('progressPct').textContent = Math.round((currentQ / 10) * 100) + '%';
    $id('progressLabel').textContent =
      t(`第 ${currentQ + 1} 题 / 共 10 题`, `Question ${currentQ + 1} of 10`);
  }
}

// ============================================================
// RESULT SCREEN
// ============================================================

function showResult() {
  $id('progressFill').style.width = '100%';
  $id('progressPct').textContent = '100%';

  // Find top character
  let bestId = null, bestScore = -1;
  Object.entries(scores).forEach(([id, s]) => {
    if (s > bestScore) { bestScore = s; bestId = id; }
  });

  resultChar = characters.find(c => c.id === bestId);

  // Calculate match percentage
  const maxPossible = Object.values(scores).reduce((a, b) => a + b, 0);
  const pct = maxPossible > 0 ? Math.round((bestScore / maxPossible) * 100) : 50;
  // Clamp between 60-98 for presentation
  const displayPct = Math.min(98, Math.max(60, pct + 30));

  // Render result card
  const card = $id('resultCard');
  card.innerHTML = `
    <div class="result-header" style="background:linear-gradient(135deg, ${resultChar.color} 0%, ${resultChar.colorDark} 100%)">
      <span class="result-emoji">${resultChar.emoji}</span>
      <div class="result-name-zh">${resultChar.nameZH}</div>
      <div class="result-name-en">${resultChar.nameEN}</div>
      <div class="result-match">
        <span class="pct">${displayPct}%</span> ${t('匹配', 'Match')}
      </div>
    </div>
    <div class="result-body">
      <div class="result-section">
        <div class="result-label">${t('📖 来源', '📖 Source')}</div>
        <div class="result-desc">${resultChar.source}</div>
      </div>
      <div class="result-section">
        <div class="result-label">${t('💬 灵魂共鸣', '💬 Soul Resonance')}</div>
        <div class="result-desc">${t(resultChar.descZH, resultChar.descEN)}</div>
      </div>
      <div class="result-section">
        <div class="result-label">${t('🏷 性格标签', '🏷 Traits')}</div>
        <div class="result-traits">
          ${t(resultChar.traitsZH, resultChar.traitsEN).map(tr =>
            `<span class="trait-tag">${tr}</span>`
          ).join('')}
        </div>
      </div>
      <div class="result-section">
        <div class="result-label">${t('✨ 灵魂金句', '✨ Signature Quote')}</div>
        <div class="result-quote">${t(resultChar.quoteZH, resultChar.quoteEN)}</div>
      </div>
      <div class="result-section">
        <div class="result-label">${t('📚 推荐阅读', '📚 Recommended Read')}</div>
        <div class="result-book">
          <span class="book-icon">📚</span>
          <span>${t(resultChar.bookZH, resultChar.bookEN)}</span>
        </div>
      </div>
    </div>
  `;

  showScreen('result');
}

// ============================================================
// SHARE POSTER (Canvas)
// ============================================================

function generatePoster() {
  if (!resultChar) return;

  const canvas = $id('posterCanvas');
  const W = 750;
  const H = 1200;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, '#ffd89b');
  bgGrad.addColorStop(0.35, '#f5a3b7');
  bgGrad.addColorStop(0.7, '#c9a7d4');
  bgGrad.addColorStop(1, '#a8c8f0');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // White card
  const cardX = 40, cardY = 80, cardW = W - 80, cardH = H - 160;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.12)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 8;
  roundRect(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  // Header strip
  const headerH = 280;
  const headerGrad = ctx.createLinearGradient(0, cardY, 0, cardY + headerH);
  headerGrad.addColorStop(0, resultChar.color);
  headerGrad.addColorStop(1, resultChar.colorDark);
  ctx.fillStyle = headerGrad;
  ctx.beginPath();
  ctx.moveTo(cardX + 24, cardY);
  ctx.lineTo(cardX + cardW - 24, cardY);
  ctx.lineTo(cardX + cardW, cardY + headerH);
  ctx.lineTo(cardX, cardY + headerH);
  ctx.closePath();
  ctx.fill();

  // Clip header to card top
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.clip();
  ctx.fillStyle = headerGrad;
  ctx.fillRect(cardX, cardY, cardW, headerH);
  ctx.restore();

  // Emoji
  ctx.font = '100px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(resultChar.emoji, W / 2, cardY + 120);

  // Name ZH
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 48px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(resultChar.nameZH, W / 2, cardY + 200);

  // Name EN
  ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(resultChar.nameEN, W / 2, cardY + 235);

  // Match percentage
  const pct = Math.min(98, Math.max(60,
    Math.round((scores[resultChar.id] / Object.values(scores).reduce((a, b) => a + b, 0)) * 100) + 30
  ));
  ctx.font = 'bold 80px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(pct + '%', W / 2, cardY + headerH - 20);

  // Body text
  const bodyY = cardY + headerH + 50;
  ctx.fillStyle = '#636e72';
  ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(lang === 'ZH' ? '灵魂共鸣度' : 'Soul Match', W / 2, bodyY);

  // Description
  const desc = lang === 'ZH' ? resultChar.descZH : resultChar.descEN;
  ctx.fillStyle = '#2d3436';
  ctx.font = '18px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
  ctx.textAlign = 'center';
  wrapText(ctx, desc, W / 2, bodyY + 50, cardW - 80, 32);

  // Quote
  const quoteY = bodyY + 200;
  ctx.fillStyle = '#ff9a56';
  ctx.fillRect(cardX + 40, quoteY - 8, 4, 60);
  ctx.fillStyle = '#2d3436';
  ctx.font = 'italic 20px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",serif';
  ctx.textAlign = 'left';
  wrapText(ctx, '"' + (lang === 'ZH' ? resultChar.quoteZH : resultChar.quoteEN) + '"',
    cardX + 64, quoteY + 10, cardW - 120, 30);

  // Footer
  const footerY = cardY + cardH - 80;
  ctx.fillStyle = '#b2bec3';
  ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(lang === 'ZH' ? '你与哪位不朽的主角共享灵魂？' : 'Which immortal protagonist shares your soul?',
    W / 2, footerY);
  ctx.fillStyle = '#c9a7d4';
  ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(lang === 'ZH' ? '扫码来测 →' : 'Scan to take the quiz →',
    W / 2, footerY + 28);

  // Return data URL
  return canvas.toDataURL('image/png', 0.92);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = text.split('');
  let line = '';
  let currentY = y;
  for (let i = 0; i < chars.length; i++) {
    const testLine = line + chars[i];
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && line.length > 0) {
      ctx.fillText(line, x, currentY);
      line = chars[i];
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  if (line.length > 0) {
    ctx.fillText(line, x, currentY);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function showPoster() {
  const dataUrl = generatePoster();
  $id('posterImage').src = dataUrl;
  $id('posterOverlay').classList.add('show');
}

function hidePoster() {
  $id('posterOverlay').classList.remove('show');
}

// ============================================================
// SHARE LINK
// ============================================================

async function shareLink() {
  const title = t(
    '你与哪位不朽的主角共享灵魂？',
    'Which immortal protagonist shares your soul?'
  );
  const text = t(
    `我的灵魂与「${resultChar.nameZH}」共鸣最深！来测测你的灵魂伴侣是谁 →`,
    `My soul resonates most with "${resultChar.nameEN}"! Find your soul match →`
  );
  const url = window.location.href;

  if (navigator.share) {
    try {
      await navigator.share({ title, text, url });
    } catch (e) {
      copyLink(text, url);
    }
  } else {
    copyLink(text, url);
  }
}

function copyLink(text, url) {
  const copyStr = text + ' ' + url;
  navigator.clipboard.writeText(copyStr).then(() => {
    alert(t('✅ 链接已复制！去粘贴分享吧～', '✅ Link copied! Paste to share~'));
  }).catch(() => {
    prompt(t('手动复制以下内容分享：', 'Copy manually:'), copyStr);
  });
}

// ============================================================
// RETRY
// ============================================================

function retakeQuiz() {
  resetScores();
  currentQ = 0;
  resultChar = null;
  showScreen('start');
}

// ============================================================
// LANGUAGE
// ============================================================

function toggleLang() {
  lang = lang === 'ZH' ? 'EN' : 'ZH';
  $id('langToggle').textContent = lang === 'ZH' ? 'EN' : '中';

  // Re-render current screen
  if ($id('quizScreen').classList.contains('active')) {
    renderQuestion();
  } else if ($id('resultScreen').classList.contains('active') && resultChar) {
    showResult();
  }
}

// ============================================================
// INIT
// ============================================================

function init() {
  initStartScreen();

  $id('langToggle').addEventListener('click', toggleLang);
  $id('sharePosterBtn').addEventListener('click', showPoster);
  $id('shareLinkBtn').addEventListener('click', shareLink);
  $id('retakeBtn').addEventListener('click', retakeQuiz);
  $id('posterClose').addEventListener('click', hidePoster);
  $id('posterOverlay').addEventListener('click', function(e) {
    if (e.target === this) hidePoster();
  });

  resetScores();
}

document.addEventListener('DOMContentLoaded', init);
</script>
