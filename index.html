<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>你与哪位不朽的主角共享灵魂？</title>
<meta name="description" content="12位文学与历史上的不朽灵魂 — 测测你的灵魂与谁共鸣最深。Which immortal protagonist shares your soul?">
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg1: #1a0f0a;
  --bg2: #2c1810;
  --bg3: #3d2020;
  --bg4: #2c1e16;
  --bg5: #1a0f0a;
  --card: #f7f0e0;
  --card-alt: #ede3d0;
  --card-shadow: 0 8px 40px rgba(0,0,0,.35);
  --text: #2c1810;
  --text2: #7a6348;
  --text3: #b8a080;
  --gold: #8b6914;
  --gold-dark: #6b3410;
  --gold-light: #c9a84c;
  --radius: 12px;
  --font: "Songti SC","STSong","SimSun","Noto Serif CJK SC","Times New Roman",Georgia,serif;
}

html, body {
  height: 100%;
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background: linear-gradient(175deg, var(--bg1) 0%, var(--bg2) 20%, var(--bg3) 45%, var(--bg4) 70%, var(--bg5) 100%);
  background-attachment: fixed;
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  position: relative;
}

/* ===== App Container ===== */
.app {
  width: 100%;
  max-width: 460px;
  position: relative;
  z-index: 1;
}

/* ===== Page Watermark ===== */
.page-watermark {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.page-watermark span {
  position: absolute;
  color: rgba(200,170,120,.06);
  font-size: 22px;
  font-weight: bold;
  white-space: nowrap;
  font-family: var(--font);
}

/* ===== Language Toggle ===== */
.lang-toggle {
  position: fixed;
  top: 16px;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  right: max(16px, env(safe-area-inset-right));
  z-index: 100;
  background: rgba(247,240,224,.12);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: #c4b49a;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.2);
  transition: all .2s;
  border: 1px solid rgba(200,170,120,.15);
  font-family: var(--font);
}
.lang-toggle:active { transform: scale(.95); opacity: .8; }

/* ===== Screen ===== */
.screen { display: none; }
.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeIn .5s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Start Screen ===== */
.start-screen { text-align: center; padding-top: 60px; }

.start-icon {
  font-size: 72px;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.start-title {
  font-size: 28px;
  font-weight: 800;
  color: #f7f0e0;
  line-height: 1.5;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.start-subtitle {
  font-size: 16px;
  color: #c4b49a;
  font-weight: 400;
  margin-bottom: 8px;
  line-height: 1.5;
  font-style: italic;
}
.start-meta {
  font-size: 13px;
  color: #b8a080;
  margin-bottom: 36px;
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.start-meta span {
  background: rgba(247,240,224,.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(200,170,120,.12);
  color: #c4b49a;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-weight: 700;
  font-size: 17px;
  cursor: pointer;
  transition: all .2s;
  min-height: 52px;
  padding: 14px 32px;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: 1px;
}
.btn:active { transform: scale(.96); }
.btn-primary {
  background: linear-gradient(135deg, #8b6914 0%, #6b3410 100%);
  color: #faf3e6;
  box-shadow: 0 6px 24px rgba(139,105,20,.3);
  width: 100%;
  font-size: 18px;
  border: 1px solid rgba(201,168,76,.3);
}
.btn-secondary {
  background: var(--card);
  color: var(--text);
  box-shadow: var(--card-shadow);
  width: 100%;
  border: 1px solid rgba(139,105,20,.1);
}

/* ===== Progress Bar ===== */
.progress-wrap {
  width: 100%;
  margin-bottom: 28px;
}
.quiz-screen { padding-top: 40px; }
.progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
  color: #c4b49a;
  font-weight: 500;
}
.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(247,240,224,.1);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid rgba(200,170,120,.1);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #8b6914, #c9a84c);
  border-radius: 3px;
  transition: width .35s ease;
}

/* ===== Question Card ===== */
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--card-shadow);
  width: 100%;
  margin-bottom: 20px;
  border: 1px solid rgba(139,105,20,.15);
  position: relative;
}
/* Parchment texture line effect */
.question-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(139,105,20,.015) 2px,
    rgba(139,105,20,.015) 4px
  );
  pointer-events: none;
}
.question-number {
  font-size: 13px;
  color: var(--gold);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 12px;
}
.question-text {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 24px;
  letter-spacing: 1px;
}

/* ===== Option Cards ===== */
.options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.option-card {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  background: #faf6ed;
  border: 1px solid rgba(139,105,20,.1);
  border-radius: 8px;
  padding: 16px 18px;
  font-family: var(--font);
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  transition: all .2s;
  text-align: left;
  line-height: 1.5;
  letter-spacing: 0.5px;
  -webkit-tap-highlight-color: transparent;
}
.option-card:active { transform: scale(.98); background: #ede3d0; border-color: rgba(139,105,20,.25); }
.option-letter {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #8b6914, #6b3410);
  color: #faf3e6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 15px;
  font-family: var(--font);
}

/* ===== Result Screen ===== */
.result-screen {
  padding-top: max(30px, env(safe-area-inset-top));
  padding-bottom: 40px;
}

.result-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  width: 100%;
  overflow: hidden;
  margin-bottom: 20px;
  border: 1px solid rgba(139,105,20,.15);
}

.result-header {
  padding: 36px 24px 24px;
  text-align: center;
  color: #faf3e6;
  position: relative;
}
.result-emoji {
  font-size: 80px;
  display: block;
  margin-bottom: 12px;
  line-height: 1;
}
.result-name-zh {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 4px;
  margin-bottom: 4px;
}
.result-name-en {
  font-size: 15px;
  font-weight: 500;
  opacity: .85;
  margin-bottom: 16px;
  font-style: italic;
  letter-spacing: 1px;
}
.result-match {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 8px 20px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 700;
  border: 1px solid rgba(255,255,255,.15);
}
.result-match .pct { font-size: 28px; font-weight: 900; }

.result-body { padding: 24px; }

.result-section { margin-bottom: 20px; }
.result-section:last-child { margin-bottom: 0; }
.result-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.result-traits {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.trait-tag {
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 4px;
  background: #faf6ed;
  color: var(--text2);
  font-weight: 500;
  border: 1px solid rgba(139,105,20,.08);
  letter-spacing: 1px;
}

.result-quote {
  font-size: 17px;
  font-style: italic;
  color: var(--text);
  line-height: 1.8;
  padding: 16px 20px;
  background: #faf3dc;
  border-radius: 4px;
  border-left: 3px solid var(--gold);
  position: relative;
  letter-spacing: 0.5px;
}
.result-quote::before {
  content: '"';
  position: absolute;
  top: 2px; left: 10px;
  font-size: 36px;
  color: var(--gold);
  font-style: normal;
  font-weight: 900;
  line-height: 1;
  opacity: .3;
}

.result-book {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: #faf6ed;
  border-radius: 4px;
  font-size: 15px;
  color: var(--text);
  font-weight: 600;
  border: 1px solid rgba(139,105,20,.08);
  letter-spacing: 0.5px;
}
.result-book .book-icon { font-size: 28px; }

.result-desc {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text2);
  letter-spacing: 0.5px;
}

.result-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  margin-bottom: 24px;
}

/* ===== Result QR Section ===== */
.result-qr-section {
  width: 100%;
  background: rgba(247,240,224,.06);
  border: 1px solid rgba(200,170,120,.1);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  margin-bottom: 16px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.result-qr-section img {
  width: 120px;
  height: 120px;
  border-radius: 8px;
  margin-bottom: 12px;
  border: 2px solid rgba(200,170,120,.15);
}
.result-qr-text {
  font-size: 14px;
  color: #c4b49a;
  font-weight: 500;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.result-qr-sub {
  font-size: 12px;
  color: #8b7355;
  letter-spacing: 0.5px;
}

/* ===== Cashback Button & Modal ===== */
.btn-cashback {
  background: rgba(247,240,224,.08);
  color: #c9a84c;
  border: 1px solid rgba(201,168,76,.2);
  border-radius: 8px;
  width: 100%;
  letter-spacing: 1px;
  font-family: var(--font);
}
.btn-cashback:hover { background: rgba(247,240,224,.12); }

.cashback-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.cashback-overlay.show { display: flex; }

.cashback-modal {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px 28px;
  text-align: center;
  max-width: 340px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  position: relative;
  border: 1px solid rgba(139,105,20,.2);
}
.cashback-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 20px;
  color: var(--text3);
  cursor: pointer;
  padding: 4px 8px;
  font-family: var(--font);
}
.cashback-close:active { opacity: .6; }
.cashback-modal h3 {
  font-size: 22px;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.cashback-modal p {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 20px;
  letter-spacing: 0.5px;
}
.cashback-modal .cashback-qr-img {
  width: 180px;
  height: 180px;
  border-radius: 8px;
  margin-bottom: 12px;
  border: 2px solid rgba(139,105,20,.1);
}
.cashback-modal .cashback-hint {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 0;
}

/* ===== Poster Modal ===== */
.poster-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 24px;
  flex-direction: column;
  gap: 16px;
}
.poster-overlay.show { display: flex; }
.poster-overlay img {
  max-width: 100%;
  max-height: 70vh;
  border-radius: 12px;
  box-shadow: 0 16px 60px rgba(0,0,0,.5);
}
.poster-hint {
  color: #c4b49a;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  opacity: .9;
}
.poster-close {
  background: rgba(247,240,224,.12);
  color: #c4b49a;
  border: 1px solid rgba(200,170,120,.2);
  border-radius: 8px;
  padding: 10px 28px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  letter-spacing: 1px;
}
.poster-close:active { opacity: .7; }

/* ===== Responsive ===== */
@media (max-width: 380px) {
  .start-title { font-size: 24px; }
  .question-text { font-size: 20px; }
  .result-name-zh { font-size: 28px; }
  .option-card { font-size: 15px; padding: 14px 16px; }
}
</style>
</head>

// ============================================================
// STATE
// ============================================================

let lang = 'ZH';            // 'ZH' | 'EN'
let currentQ = 0;           // 0-9
let scores = {};            // { characterId: totalScore }
let resultChar = null;

// ============================================================
// HELPERS
// ============================================================

function t(zh, en) { return lang === 'ZH' ? zh : en; }

function $id(id) { return document.getElementById(id); }

function resetScores() {
  scores = {};
  characters.forEach(c => { scores[c.id] = 0; });
}

// ============================================================
// SCREEN SWITCHING
// ============================================================

function showScreen(name) {
  ['startScreen', 'quizScreen', 'resultScreen'].forEach(id => {
    $id(id).classList.remove('active');
  });
  const map = { start: 'startScreen', quiz: 'quizScreen', result: 'resultScreen' };
  $id(map[name]).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// START SCREEN
// ============================================================

function initStartScreen() {
  $id('startBtn').addEventListener('click', startQuiz);
}

function startQuiz() {
  resetScores();
  currentQ = 0;
  resultChar = null;
  renderQuestion();
  showScreen('quiz');
}

// ============================================================
// QUIZ SCREEN
// ============================================================

function renderQuestion() {
  const q = questions[currentQ];
  $id('questionNumber').textContent =
    t('QUESTION', 'QUESTION') + ' ' + (currentQ + 1);
  $id('questionText').textContent = t(q.textZH, q.textEN);
  $id('progressLabel').textContent =
    t(`第 ${currentQ + 1} 题 / 共 10 题`, `Question ${currentQ + 1} of 10`);
  $id('progressPct').textContent = Math.round((currentQ / 10) * 100) + '%';
  $id('progressFill').style.width = ((currentQ / 10) * 100) + '%';

  const container = $id('optionsContainer');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-card';
    btn.innerHTML = `
      <span class="option-letter">${opt.letter}</span>
      <span>${t(opt.textZH, opt.textEN)}</span>
    `;
    btn.addEventListener('click', () => selectOption(idx));
    container.appendChild(btn);
  });
}

function selectOption(optIdx) {
  const q = questions[currentQ];
  const chosen = q.options[optIdx];

  // Add scores
  Object.entries(chosen.scores).forEach(([charId, pts]) => {
    scores[charId] = (scores[charId] || 0) + pts;
  });

  currentQ++;

  if (currentQ >= questions.length) {
    showResult();
  } else {
    renderQuestion();
    $id('progressFill').style.width = ((currentQ / 10) * 100) + '%';
    $id('progressPct').textContent = Math.round((currentQ / 10) * 100) + '%';
    $id('progressLabel').textContent =
      t(`第 ${currentQ + 1} 题 / 共 10 题`, `Question ${currentQ + 1} of 10`);
  }
}

// ============================================================
// RESULT SCREEN
// ============================================================

function showResult() {
  $id('progressFill').style.width = '100%';
  $id('progressPct').textContent = '100%';

  // Find top character
  let bestId = null, bestScore = -1;
  Object.entries(scores).forEach(([id, s]) => {
    if (s > bestScore) { bestScore = s; bestId = id; }
  });

  resultChar = characters.find(c => c.id === bestId);

  // Calculate match percentage
  const maxPossible = Object.values(scores).reduce((a, b) => a + b, 0);
  const pct = maxPossible > 0 ? Math.round((bestScore / maxPossible) * 100) : 50;
  // Clamp between 60-98 for presentation
  const displayPct = Math.min(98, Math.max(60, pct + 30));

  // Render result card
  const card = $id('resultCard');
  card.innerHTML = `
    <div class="result-header" style="background:linear-gradient(135deg, ${resultChar.color} 0%, ${resultChar.colorDark} 100%)">
      <span class="result-emoji">${resultChar.emoji}</span>
      <div class="result-name-zh">${resultChar.nameZH}</div>
      <div class="result-name-en">${resultChar.nameEN}</div>
      <div class="result-match">

// Canvas 圆角矩形辅助函数
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// 二维码图片（本地文件）
const XHS_QR_PATH = 'xhs-qr.png';
const REVIEW_QR_PATH = 'review-qr.png';

function loadLocalImage(path) {
  return new Promise((resolve) => {
    const img = new Image();
    const timer = setTimeout(() => resolve(null), 5000);
    img.onload = () => { clearTimeout(timer); resolve(img); };
    img.onerror = () => { clearTimeout(timer); resolve(null); };
    img.src = path;
  });
}

async function generatePoster() {
  if (!resultChar) return;

  const canvas = $id('posterCanvas');
  const W = 750, H = 1500;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // ── 背景渐变 ──
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, '#ffd89b');
  bgGrad.addColorStop(0.3, '#f5a3b7');
  bgGrad.addColorStop(0.65, '#c9a7d4');
  bgGrad.addColorStop(1, '#a8c8f0');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // ── 水印（斜排半透明文字） ──
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 60px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  for (let row = -2; row < 6; row++) {
    for (let col = -2; col < 6; col++) {
      ctx.fillText('小红书 自我说明书l71', W / 2 + col * 350, H / 2 + row * 180);
    }
  }
  ctx.restore();

  // ── 白色卡片 ──
  const cardX = 40, cardY = 50, cardW = W - 80, cardH = H - 100;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.12)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 8;
  roundRect(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  // ── 顶部彩色 Header ──
  const headerH = 260;
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.clip();
  const headerGrad = ctx.createLinearGradient(0, cardY, 0, cardY + headerH);
  headerGrad.addColorStop(0, resultChar.color);
  headerGrad.addColorStop(1, resultChar.colorDark);
  ctx.fillStyle = headerGrad;
  ctx.fillRect(cardX, cardY, cardW, headerH);
  ctx.restore();

  // Emoji
  ctx.font = '90px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(resultChar.emoji, W / 2, cardY + 110);

  // 名字
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 46px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
  ctx.fillText(resultChar.nameZH, W / 2, cardY + 178);
  ctx.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(resultChar.nameEN, W / 2, cardY + 210);

  // 匹配度
  const pct = Math.min(98, Math.max(60,
    Math.round((scores[resultChar.id] / Object.values(scores).reduce((a, b) => a + b, 0)) * 100) + 30
  ));
  ctx.font = 'bold 72px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(pct + '%', W / 2, cardY + headerH - 14);

  // ── 正文区域 ──
  const pad = cardX + 32;
  const contentW = cardW - 64;
  let y = cardY + headerH + 36;
  const isZH = lang === 'ZH';

  // 辅助：画标签
  function drawLabel(text) {
    ctx.fillStyle = '#b2bec3';
    ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(text, pad, y);
    y += 20;
  }

  // 辅助：画正文（自动换行）
  function drawBody(text, fontSize, lineH, color) {
    ctx.fillStyle = color || '#2d3436';
    ctx.font = (fontSize || 17) + 'px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
    ctx.textAlign = 'left';
    const lines = wrapLines(ctx, text, contentW);
    lines.forEach(line => {
      ctx.fillText(line, pad, y);
      y += lineH || 28;
    });
  }

  // 1) 灵魂共鸣度
  drawLabel(isZH ? '💬 灵魂共鸣' : '💬 Soul Resonance');
  drawBody(isZH ? resultChar.descZH : resultChar.descEN, 17, 28);
  y += 8;

  // 2) 来源
  drawLabel(isZH ? '📖 来源' : '📖 Source');
  drawBody(resultChar.source, 15, 24, '#636e72');
  y += 8;

  // 3) 性格标签
  drawLabel(isZH ? '🏷 性格标签' : '🏷 Traits');
  const traits = isZH ? resultChar.traitsZH : resultChar.traitsEN;
  let tagX = pad;
  let tagStartY = y;
  traits.forEach(tag => {
    const tagW = ctx.measureText(tag).width + 28;
    if (tagX + tagW > pad + contentW) {
      tagX = pad;
      y += 34;
    }
    ctx.fillStyle = '#f8f9fa';
    roundRect(ctx, tagX, y - 14, tagW, 28, 14);
    ctx.fill();
    ctx.fillStyle = '#636e72';
    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(tag, tagX + 14, y + 4);
    tagX += tagW + 10;
  });
  y = Math.max(y + 28, tagStartY + 42);
  y += 6;

  // 4) 灵魂金句
  drawLabel(isZH ? '✨ 灵魂金句' : '✨ Signature Quote');
  const quote = isZH ? resultChar.quoteZH : resultChar.quoteEN;
  ctx.fillStyle = '#fdf6f0';
  roundRect(ctx, pad, y - 2, contentW, 54, 12);
  ctx.fill();
  ctx.fillStyle = '#ff9a56';
  ctx.fillRect(pad + 4, y + 4, 3, 36);
  ctx.fillStyle = '#2d3436';
  ctx.font = 'italic 16px "PingFang SC","Georgia",serif';
  ctx.textAlign = 'left';
  ctx.fillText('"' + quote + '"', pad + 18, y + 28);
  y += 60;
  y += 8;

  // 5) 推荐阅读
  drawLabel(isZH ? '📚 推荐阅读' : '📚 Recommended Read');
  ctx.fillStyle = '#f8f9fa';
  roundRect(ctx, pad, y - 2, contentW, 36, 12);
  ctx.fill();
  ctx.fillStyle = '#2d3436';
  ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  const bookText = isZH ? resultChar.bookZH : resultChar.bookEN;
  ctx.fillText('📚  ' + bookText, pad + 14, y + 22);
  y += 50;

  // 6) 二维码区域
  y += 4;
  const qrSize = 140;
  const qrY = y;
  const leftQRCenter = W / 2 - 100;
  const rightQRCenter = W / 2 + 100;

  // 加载本地二维码（超时或失败则显示占位框）
  const [xhsQR, reviewQR] = await Promise.all([
    loadLocalImage(XHS_QR_PATH),
    loadLocalImage(REVIEW_QR_PATH)
  ]);

  function drawQRPlaceholder(cx, cy, label) {
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    roundRect(ctx, cx - qrSize/2, cy, qrSize, qrSize, 12);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#b2bec3';
    ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, cx, cy + qrSize/2 + 4);
  }

  // 左：小红书
  if (xhsQR) {
    ctx.drawImage(xhsQR, leftQRCenter - qrSize/2, qrY, qrSize, qrSize);
  } else {
    drawQRPlaceholder(leftQRCenter, qrY, '小红书');
  }
  ctx.fillStyle = '#636e72';
  ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(isZH ? '关注小红书' : 'Follow on RED', leftQRCenter, qrY + qrSize + 20);

  // 右：好评
  if (reviewQR) {
    ctx.drawImage(reviewQR, rightQRCenter - qrSize/2, qrY, qrSize, qrSize);
  } else {
    drawQRPlaceholder(rightQRCenter, qrY, '好评');
  }
  ctx.fillStyle = '#636e72';
  ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(isZH ? '扫码给个好评' : 'Leave a review', rightQRCenter, qrY + qrSize + 20);

  y = qrY + qrSize + 40;

  // ── 底部 ──
  y += 10;
  ctx.fillStyle = '#b2bec3';
  ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(
    isZH ? '你与哪位不朽的主角共享灵魂？' : 'Which immortal protagonist shares your soul?',
    W / 2, y
  );
  y += 26;
  ctx.fillStyle = '#c9a7d4';
  ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(isZH ? '扫码来测，找到你的灵魂共鸣 →' : 'Scan to find your soul match →', W / 2, y);

  return canvas.toDataURL('image/png', 0.92);
}

// 辅助：Canvas 文字换行
function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  let current = '';
  for (const char of text) {
    const test = current + char;
    if (ctx.measureText(test).width > maxWidth && current.length > 0) {
      lines.push(current);
      current = char;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

async function showPoster() {
  try {
    const dataUrl = await generatePoster();
    $id('posterImage').src = dataUrl;
    $id('posterOverlay').classList.add('show');
  } catch (e) {
    alert(t('海报生成失败，请重试', 'Poster generation failed, please retry'));
  }
}

function hidePoster() {
  $id('posterOverlay').classList.remove('show');
}

  $id('cashbackOverlay').classList.add('show');
}

function closeCashback() {
  $id('cashbackOverlay').classList.remove('show');

// ============================================================
// PAGE WATERMARK
// ============================================================

function initWatermark() {
  const container = $id('pageWatermark');
  const text = '小红书 自我说明书l71';

  // Create a grid of watermark texts
  const cols = 4;
  const rows = 8;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const cellW = w / cols;
  const cellH = h / rows;

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const span = document.createElement('span');
      span.textContent = text;
      span.style.left = (col * cellW + cellW / 2) + 'px';
      span.style.top = (row * cellH + cellH / 2) + 'px';
      span.style.transform = 'translate(-50%, -50%) rotate(-25deg)';
      container.appendChild(span);
    }
  }
}

function retakeQuiz() {
  resetScores();
  currentQ = 0;
  resultChar = null;
  showScreen('start');
}

function toggleLang() {
  lang = lang === 'ZH' ? 'EN' : 'ZH';
  $id('langToggle').textContent = lang === 'ZH' ? 'EN' : '中';

  // Re-render current screen
  if ($id('quizScreen').classList.contains('active')) {
    renderQuestion();
  } else if ($id('resultScreen').classList.contains('active') && resultChar) {
    showResult();
  }
}

function init() {
  initStartScreen();
  initWatermark();

  $id('langToggle').addEventListener('click', toggleLang);
  $id('sharePosterBtn').addEventListener('click', showPoster);
  $id('retakeBtn').addEventListener('click', retakeQuiz);
  $id('posterClose').addEventListener('click', hidePoster);
  $id('posterOverlay').addEventListener('click', function(e) {
    if (e.target === this) hidePoster();
  });
  $id('cashbackBtn').addEventListener('click', openCashback);
  $id('cashbackClose').addEventListener('click', closeCashback);
  $id('cashbackOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeCashback();
  });

  resetScores();
}

document.addEventListener('DOMContentLoaded', init);
